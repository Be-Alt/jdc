<main class="min-h-screen bg-slate-100 text-slate-950">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 px-4 py-3 backdrop-blur lg:px-8 lg:py-5">
    <div class="flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
      <div class="flex min-w-0 items-center gap-3">
        @if (!isOverviewPage) {
          <a
            routerLink="/dashboard/overview"
            class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl border border-slate-200 bg-white text-xl text-slate-700 shadow-sm transition hover:bg-slate-50"
            aria-label="Retour à l’accueil"
          >
            ←
          </a>
        }

        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-slate-950 text-sm font-semibold text-white">
          J
        </div>
        <div class="min-w-0">
          <p class="text-[11px] font-medium tracking-[0.22em] text-slate-500 uppercase">Journal de classe</p>
          <h1 class="truncate text-lg font-semibold tracking-tight text-slate-950 sm:text-xl lg:text-3xl">
            {{ isOverviewPage ? 'Toutes les fonctionnalités' : 'Espace JDC' }}
          </h1>
        </div>
      </div>

      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-end">
        @if (isLoading) {
          <div class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3">
            <div class="h-4 w-40 animate-pulse rounded bg-slate-200"></div>
          </div>
        } @else {
          <a
            routerLink="/dashboard/teacher-profile"
            class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600 transition hover:border-sky-200 hover:bg-white hover:shadow-sm"
            aria-label="Ouvrir mon profil professeur"
          >
            <span class="font-semibold text-slate-950">{{ userName }}</span>
            <span class="hidden sm:inline"> · {{ currentUserRole }}</span>
            <span class="ml-2 text-sky-700">Profil</span>
          </a>
        }

        <button
          type="button"
          (click)="signOut()"
          [disabled]="isSigningOut"
          class="rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-800 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-60"
        >
          {{ isSigningOut ? 'Déconnexion...' : 'Se déconnecter' }}
        </button>
      </div>
    </div>
  </header>

  <section class="mx-auto w-full max-w-7xl px-4 py-5 lg:px-8 lg:py-8">
    @if (errorMessage) {
      <div class="mb-5 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700">
        {{ errorMessage }}
      </div>
    }

    @if (endpointError) {
      <div class="mb-5 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-700">
        {{ endpointError }}
      </div>
    }

    <router-outlet />
  </section>
</main>
